services:
  # Boomers API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boomers-api
    restart: unless-stopped
    ports:
      - "5002:5001"  # External:Internal - use 5002 to avoid conflict with local dev
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - boomers-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Service (for caching and BullMQ)
  redis:
    image: redis:7-alpine
    container_name: boomers-redis
    restart: unless-stopped
    # Uncomment below if you need to access Redis from host machine
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - boomers-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Service (optional - for local development)
  # Uncomment if you want to use local MongoDB instead of Atlas
  # mongodb:
  #   image: mongo:7
  #   container_name: boomers-mongodb
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb-data:/data/db
  #   networks:
  #     - boomers-network
  #   environment:
  #     - MONGO_INITDB_DATABASE=boomers
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  boomers-network:
    driver: bridge

volumes:
  redis-data:
  # mongodb-data:  # Uncomment if using local MongoDB
